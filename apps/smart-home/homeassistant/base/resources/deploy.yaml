apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      initContainers:
        # HA image ships a broken pip (Missing pip._vendor.idna.core on 2026.7.3).
        # Install with a stock Python image into the shared /config/deps volume.
        - name: install-hass-web-proxy-lib
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              if ls -d /config/deps/hass_web_proxy_lib /config/deps/hass_web_proxy_lib-*.dist-info >/dev/null 2>&1; then
                echo "hass-web-proxy-lib already present in /config/deps"
                exit 0
              fi
              pip install --no-cache-dir --target /config/deps hass-web-proxy-lib
          volumeMounts:
            - name: ha-config-root
              mountPath: /config
      containers:
      - name: home-assistant-app
        image: ghcr.io/home-assistant/home-assistant
        imagePullPolicy: IfNotPresent
        env:
          - name: PYTHONPATH
            value: /config/deps
        securityContext:
          privileged: null
        ports:
          - name: http
            containerPort: 8123
            protocol: TCP
        resources: {}
        livenessProbe:
          httpGet:
            path: /manifest.json
            port: http
          initialDelaySeconds: 0
          failureThreshold: 3
          timeoutSeconds: 1
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /manifest.json
            port: http
          initialDelaySeconds: 0
          failureThreshold: 3
          timeoutSeconds: 1
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: 8123
          initialDelaySeconds: 0
          failureThreshold: 30
          timeoutSeconds: 1
          periodSeconds: 5
        volumeMounts:
          - name: ha-config-root
            mountPath: /config
      restartPolicy: Always
      volumes:
        - name: ha-config-root
          persistentVolumeClaim:
            claimName: homeassistant-config
