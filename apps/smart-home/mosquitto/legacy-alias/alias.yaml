# Namespace stub — conservé pour l'alias DNS legacy (ExternalName).
# Le broker réel tourne dans smart-home.
apiVersion: v1
kind: Namespace
metadata:
  name: mosquitto
  labels:
    homelab.brendan.dev/role: mqtt-legacy-alias
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    homelab.brendan.dev/role: mqtt-legacy-alias
spec:
  type: ExternalName
  externalName: mosquitto.smart-home.svc.cluster.local
  ports:
  - name: mqtt
    port: 1883
    protocol: TCP
