apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smart-home
commonLabels:
  app.kubernetes.io/name: zigbee2mqtt
commonAnnotations:
  app.kubernetes.io/name: zigbee2mqtt

configMapGenerator:
- name: zigbee2mqtt-config
  files:
  - ./assets/configuration.yaml

resources:
- ./resources/deploy.yaml
- ./resources/svc.yaml
- ./resources/ing.yaml
- ./resources/storageclass.yaml
- ./resources/pvc.yaml

images:
- name: koenkk/zigbee2mqtt
  newTag: 2.13.0
