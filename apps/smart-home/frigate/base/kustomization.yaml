apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  app.kubernetes.io/name: frigate

namespace: smart-home

generators:
- ./secret-generator.yaml

resources:
- ./deploy.yaml
- ./svc.yaml
- ./ing.yaml
- ./pvc.yaml
- ./storageclass.yaml

configMapGenerator:
- name: config
  files:
  - ./assets/config.yaml

images:
- name: ghcr.io/blakeblackshear/frigate
  newTag: 0.14.1
