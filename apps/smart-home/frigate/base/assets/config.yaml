mqtt:
  enabled: True
  host: mosquitto.smart-home

# Required since 0.16 (detect disabled by default without this).
detect:
  enabled: true

go2rtc:
  streams:
    front:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.8.99:554/cam/realmonitor?channel=1&subtype=0&unicast=true&proto=Onvif
    front_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.8.99:554/cam/realmonitor?channel=1&subtype=1&unicast=true&proto=Onvif
    front2:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.8.98:554/cam/realmonitor?channel=1&subtype=0&unicast=true&proto=Onvif
    front2_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.8.98:554/cam/realmonitor?channel=1&subtype=1&unicast=true&proto=Onvif

# 0.17 tiered retention (was retain.mode=all days=7 + events.retain default=14 mode=motion).
record:
  enabled: True
  continuous:
    days: 7
  motion:
    days: 7
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

cameras:
  front:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/front_sub
          roles:
            - detect
    onvif:
      host: 192.168.8.99
      port: 80
      user: "{FRIGATE_RTSP_USER}"
      password: "{FRIGATE_RTSP_PASSWORD}"
    # Sous-flux réel : 704x576. Sans ces valeurs, le probe au démarrage
    # a expiré et Frigate est resté sur 1280x720 (image étirée).
    detect:
      enabled: true
      width: 704
      height: 576
      fps: 5
    record:
      enabled: true
    objects:
      track:
        - cat
        - dog
        - person
      filters:
        person:
          min_score: 0.65
          threshold: 0.75
          min_area: 1500
          # Applique murale noire, en haut à droite. Le bas de la boîte
          # doit tomber ici pour être ignoré ; le gravier reste détecté.
          mask: 0.76,0.08,0.92,0.08,0.92,0.32,0.76,0.32
    zones:
      privacy:
        coordinates: 0.424,0.195,0,0.51,0,1,0.712,1,0.812,0.322
        loitering_time: 0
        objects:
          - person
    motion:
      mask: 0.794,0.033,0.793,0.083,0.979,0.088,0.98,0.031
    review:
      alerts:
        required_zones: privacy
  front2:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front2
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/front2_sub
          roles:
            - detect
    onvif:
      host: 192.168.8.98
      port: 80
      user: "{FRIGATE_RTSP_USER}"
      password: "{FRIGATE_RTSP_PASSWORD}"
    # Au dernier démarrage ce sous-flux était encore le flux principal.
    # Frigate a donc figé la détection en 2688x1520 et étire le 704x576.
    detect:
      enabled: true
      width: 704
      height: 576
      fps: 5
    record:
      enabled: true
    objects:
      track:
        - cat
        - dog
        - person
      filters:
        person:
          min_score: 0.65
          threshold: 0.75
          min_area: 1500
    zones:
      privacy:
        coordinates: 1,0.462,0.678,0.19,0.302,0.02,0.072,0,0,0,0,0.333,0,1,1,1
        loitering_time: 0
        objects:
          - person
    motion:
      mask: 0.88,0.035,0.88,0.084,0.971,0.083,0.968,0.034
    review:
      alerts:
        required_zones: privacy

version: "0.17-0"
