apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infra
commonLabels:
  app.kubernetes.io/name: vaultwarden
commonAnnotations:
  app.kubernetes.io/name: vaultwarden

generators:
- ./secret-generator.yaml

resources:
- deploy.yaml
- ing.yaml
- pvc.yaml
- sc.yaml
- svc.yaml
- config.yaml

images:
- name: docker.io/vaultwarden/server
  newTag: "1.37.0"
