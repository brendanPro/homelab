apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proteus
  namespace: platform
spec:
  revisionHistoryLimit: 3
  project: default
  source:
    repoURL: git@github.com:brendanPro/homelab.git
    targetRevision: experiment/proteus
    path: platform/proteus
  destination:
    server: https://kubernetes.default.svc
    namespace: proteus-system
  # CRDs drift under ServerSideApply (managedFields / status) — cosmetic OutOfSync
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata
        - .status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
